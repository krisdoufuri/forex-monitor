<!DOCTYPE html>
<html>
<head>
  <title>Forex Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css
</head>

<body class="bg-light">
<div class="container mt-4">
  <div class="card shadow text-center">
    <div class="card-body">

      <h4>EUR / USD</h4>
      <h5>Price: <span id="price">1.0865</span></h5>

      <p>MA20: <span id="ma20">1.0830</span></p>
      <p>MA50: <span id="ma50">1.0785</span></p>
      <p>RSI: <span id="rsi">38</span></p>

      <hr>
      <h5 id="signal" class="fw-bold"></h5>

    </div>
  </div>
</div>

app.js
</body>
</html>
