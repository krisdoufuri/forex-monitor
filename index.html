
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forex Monitor</title>
  <style>
    body { font-family: Arial; padding: 16px; }
    .signal { font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>

<h2>EUR / USD</h2>
<div id="price">Loading...</div>
<div id="signal" class="signal"></div>

<script>
fetch("https://www.freeforexapi.com/api/live?pairs=EURUSD")
  .then(res => res.json())
  .then(data => {
    const price = data.rates.EURUSD.rate;
    document.getElementById("price").innerText = "Price: " + price;

    if (price > 1.08) {
      document.getElementById("signal").innerText = "✅ BUY";
    } else {
      document.getElementById("signal").innerText = "⚠️ WAIT";
    }
  });
</script>

</body>
</html>
