<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forex Monitor</title>

  <!-- Mobile responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Simple styling -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #333;
    }

    header {
      background: #1e293b;
      color: #fff;
      padding: 16px;
      text-align: center;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .pair {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .pair h2 {
      margin: 0 0 8px 0;
    }

    .rate {
      font-size: 32px;
      font-weight: bold;
      margin: 8px 0;
    }

    .signal {
      font-size: 18px;
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    .buy {
      background: #dcfce7;
      color: #166534;
    }

    .sell {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #e5e7eb;
      color: #374151;
    }

    footer {
      font-size: 12px;
      text-align: center;
      padding: 16px;
      color: #6b7280;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <header>
    <h1>📈 Forex Monitor</h1>
    <p>USD/JPY & EUR/USD</p>
  </header>

  <main>

    <div class="pair" id="usdjpy">
      <h2>USD / JPY</h2>
      <div class="rate" id="rate-usdjpy">--</div>
      <div class="signal neutral" id="signal-usdjpy">Loading...</div>
    </div>

    <div class="pair" id="eurusd">
      <h2>EUR / USD</h2>
      <div class="rate" id="rate-eurusd">--</div>
      <div class="signal neutral" id="signal-eurusd">Loading...</div>
    </div>

    <button onclick="loadRates()">🔄 Refresh Rates</button>

  </main>

  <footer>
    Indicator only. Not trading advice.
  </footer>

<script>
async function loadRates() {
  try {
    // Free API (no key required)
    const response = await fetch(
      "https://api.exchangerate.host/latest?base=USD&symbols=JPY,EUR"
    );

    const data = await response.json();

    const usdjpy = data.rates.JPY;
    const eurusd = 1 / data.rates.EUR; // Convert EUR/USD

    updatePair("usdjpy", usdjpy);
    updatePair("eurusd", eurusd);

  } catch (error) {
    console.error("Error fetching rates", error);
  }
}

function updatePair(pair, rate) {
  const rateEl = document.getElementById("rate-" + pair);
  const signalEl = document.getElementById("signal-" + pair);

  rateEl.textContent = rate.toFixed(4);

  // SIMPLE logic example
  if (rate < getLowerThreshold(pair)) {
    signalEl.textContent = "✅ Good to Buy";
    signalEl.className = "signal buy";
  } else if (rate > getUpperThreshold(pair)) {
    signalEl.textContent = "🔻 Good to Sell";
    signalEl.className = "signal sell";
  } else {
    signalEl.textContent = "⏸ Neutral";
    signalEl.className = "signal neutral";
  }
}

// Basic thresholds (you can tweak these)
function getLowerThreshold(pair) {
  return pair === "usdjpy" ? 145 : 1.0700;
}

function getUpperThreshold(pair) {
  return pair === "usdjpy" ? 150 : 1.1000;
}

// Auto-load on open
loadRates();
</script>

</body>
</html>
